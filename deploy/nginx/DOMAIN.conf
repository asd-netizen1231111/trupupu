# Витрина (Next.js, 127.0.0.1:8000).
# Плейсхолдеры DOMAIN и API_DOMAIN заменяет apply.sh. Пока только порт 80,
# HTTPS и редирект http -> https добавит certbot (промт 13): он сам допишет listen 443 ssl.
# Заголовок X-Forwarded-Proto берётся из $scheme, поэтому после certbot в 443-блоке он станет https.

# Для WebSocket/upgrade (HMR в dev, Next может апгрейдить соединение).
map $http_upgrade $dobrayahata_connection_upgrade {
    default upgrade;
    ''      '';
}

# www -> без www (постоянный редирект)
server {
    listen 80;
    listen [::]:80;
    server_name www.DOMAIN;

    server_tokens off;

    return 301 $scheme://DOMAIN$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    server_tokens off;
    client_max_body_size 10M;

    # gzip (Next сам сжимает свои ответы; nginx не сжимает уже сжатое)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / upgrade
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $dobrayahata_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
