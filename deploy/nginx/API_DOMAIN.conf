# Бэкенд Medusa и админка /app (127.0.0.1:9000).
# Плейсхолдер API_DOMAIN заменяет apply.sh. Пока только порт 80, HTTPS добавит certbot (промт 13).
#
# ВАЖНО: Medusa в production ставит secure-cookie, поэтому вход в админку
# заработает только после включения HTTPS. До certbot админку не проверять.

# --- Ограничение запросов (контекст http, файл подключается внутри http) ---
# Вход в админку: 10 запросов/мин с одного IP.
limit_req_zone $binary_remote_addr zone=dobrayahata_admin_auth:10m rate=10r/m;
# Вход/регистрация покупателей: 60 запросов/мин с одного IP.
# ВНИМАНИЕ: вход покупателей выполняет сервер витрины (Next ходит на API с IP самого VPS),
# поэтому для nginx это один IP на всех покупателей. Лимит сделан мягким, он режет в основном
# прямой перебор паролей к API. Строже ставить только после проброса IP клиента из витрины.
limit_req_zone $binary_remote_addr zone=dobrayahata_customer_auth:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    server_tokens off;

    limit_req_status 429;
    limit_req_log_level warn;

    # Загрузка фото/файлов в админке (в Medusa свой лимит admin.maxUploadFileSize)
    client_max_body_size 50M;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # Общие заголовки прокси повторяются в каждом location: nginx не наследует
    # proxy_set_header, если в location задан хотя бы один свой.

    # --- Вход в админку (и приглашения/сброс пароля): строгий лимит ---
    location /auth/user/ {
        limit_req zone=dobrayahata_admin_auth burst=5 nodelay;

        # Доступ только с ваших IP (включить: раскомментировать обе строки, подставить IP)
        # allow 203.0.113.10;
        # deny  all;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Вход, регистрация, сброс пароля покупателей ---
    location /auth/customer/ {
        limit_req zone=dobrayahata_customer_auth burst=30 nodelay;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Админка (интерфейс) /app ---
    # Вариант 1: доступ по IP. Раскомментировать allow/deny, подставить свои IP.
    # Вариант 2: пароль (auth_basic). Создать файл на сервере:
    #     sudo apt install apache2-utils
    #     sudo htpasswd -c /etc/nginx/.htpasswd-admin admin
    #   и раскомментировать две строки auth_basic.
    # Можно включить оба варианта сразу: чтобы требовалось ЛИБО IP, ЛИБО пароль,
    # раскомментируйте также "satisfy any;" (по умолчанию нужно и то и другое).
    # Это защищает только страницу /app. Сами запросы /admin/* защищены токеном Medusa.
    # Basic-авторизацию на /admin/ не включайте: она конфликтует с заголовком Authorization.
    location ~ ^/app(/|$) {
        # satisfy any;

        # allow 203.0.113.10;
        # allow 198.51.100.0/24;
        # deny  all;

        # auth_basic           "Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Фото и файлы: кэш на 30 дней ---
    # Имена файлов Medusa содержат метку времени, поэтому долгий кэш безопасен.
    location /static/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000" always;

        # Альтернатива: отдавать файлы напрямую с диска, минуя Medusa
        # (заменить блок выше на этот, путь из static-sync.md):
        # alias /var/www/dobrayahata/static/;
        # access_log off;
    }

    # --- Всё остальное: API Medusa ---
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
